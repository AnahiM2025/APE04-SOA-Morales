# NGINX: punto unico de entrada REST (puerto 8090) para la APE 04.
# Probar sintaxis:  nginx -p <carpeta infra/nginx> -c nginx.conf -t      Recargar: nginx -p ... -c nginx.conf -s reload
worker_processes  1;

events { worker_connections 1024; }

http {
    sendfile      on;
    keepalive_timeout 30;

    # El log registra QUE instancia atendio cada peticion ($upstream_addr):
    # de aqui salen los conteos reales A/B de la prueba P23.
    log_format balanceo '$remote_addr [$time_local] "$request" $status '
                        'upstream=$upstream_addr rt=$request_time';
    access_log logs/access.log balanceo;

    # Java de vehiculos: dos instancias equivalentes, ponderacion 3:1 y tolerancia a fallos.
    upstream vehiculos_java {
        server 127.0.0.1:8080 weight=3 max_fails=2 fail_timeout=10s;   # instancia A
        server 127.0.0.1:8082 weight=1 max_fails=2 fail_timeout=10s;   # instancia B
    }
    upstream ventas_fastapi        { server 127.0.0.1:8002; }
    upstream notificaciones_java   { server 127.0.0.1:8081; }

    server {
        listen       127.0.0.1:8090;
        server_name  localhost;
        client_max_body_size 1m;
        # Evidencia de balanceo visible para el cliente (P23): que instancia atendio la peticion.
        add_header X-Upstream $upstream_addr always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout    15s;
        # Si una instancia no conecta o falla, se reintenta con la otra.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # Comprobacion del propio NGINX: no toca ningun backend.
        location = /nginx-ping {
            access_log off;
            default_type text/plain;
            return 200 "pong\n";
        }

        # --- API Java de vehiculos (balanceada A/B) ---
        location = /oauth/token        { proxy_pass http://vehiculos_java; }
        location /api/vehiculos        { proxy_pass http://vehiculos_java; }
        location = /api/identidad      { proxy_pass http://vehiculos_java; }   # la usa FastAPI para validar el JWT
        location /api/reservas         { proxy_pass http://vehiculos_java; }   # llamadas internas de FastAPI (X-Service-Key)
        location = /actuator/health    { proxy_pass http://vehiculos_java; }

        # --- API Python de compradores y ventas (una sola instancia) ---
        location /api/compradores      { proxy_pass http://ventas_fastapi; }
        location /api/ventas           { proxy_pass http://ventas_fastapi; }

        # --- Notificaciones (JavaFX consulta por sondeo periodico) ---
        location /api/notificaciones   { proxy_pass http://notificaciones_java; }

        location / { return 404; }
    }
}
