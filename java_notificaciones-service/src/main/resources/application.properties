spring.application.name=notificaciones-service
server.port=${SERVER_PORT:8081}
server.address=127.0.0.1

# MySQL: esquema propio del servicio (no comparte tablas con vehiculos ni ventas).
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:notificaciones_vehiculos}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ: credenciales por variables de entorno (nunca en el repositorio).
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Un mensaje a la vez: confirma (ack) solo despues de guardarlo en MySQL.
spring.rabbitmq.listener.simple.prefetch=1
app.rabbit.queue=${RABBITMQ_QUEUE:notificaciones.ventas}

# Clave compartida para POST /api/notificaciones (emisor Java de vehiculos).
app.notificacion-key=${NOTIFICACIONES_KEY}
# Los GET validan el JWT del usuario consultando /api/identidad (a traves de NGINX).
app.identidad-url=${IDENTIDAD_URL:http://127.0.0.1:8090}
